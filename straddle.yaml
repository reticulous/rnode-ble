# rnode-ble — a Bluetooth door onto the RNode endpoint iface-lora already has.
#
# A Nordic UART Service, advertised as "RNode xxxx", wired straight onto
# RNODE_ITS_PORT. Sideband and any RNS RNodeInterface connect to it and get the
# same KISS stream the USB and TCP doors carry. There is no KISS code here, no
# radio knowledge and no second session policy: this straddle moves bytes.
schema_version: 1
name: reticulous/rnode-ble
prefix: rnode_ble
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  # The radio, the endpoint and RNODE_ITS_PORT.
  - reticulous/iface-lora
  # The Bluetooth stack. spangap-ble owns the host, the advertising instance,
  # the bond store and the connection budget; this straddle is a consumer of
  # ble.h and initialises nothing itself.
  - spangap/spangap-ble

# Boot-registered service: RnodeBleService::onInit() queues the Nordic UART
# Service with spangap-ble (which registers it when the host starts), registers
# the `rnode-ble` CLI verb and spawns the door task. `requires:` puts both
# spangap-ble's and iface-lora's onInit() ahead of it in dependency-topo order,
# so the GATT registry and the endpoint's ITS port already exist.
services:
  - { class: RnodeBleService, header: rnode_ble.h }

# The switch sits in iface-lora's RNode-endpoint menu, under its "Doors"
# heading — the title must match that string exactly, since heading groups
# merge on an exact match and a near-miss silently becomes a second heading.
# The key sits beside the endpoint's other transports (s.lora.rnode.serial /
# .tcp / .ble): one namespace for one endpoint, each its own switch.
settings:
  - at:
      - { id: reticulum }
      - { id: rnode }
    rows:
      - heading: "Connect via"
      - switch: { label: "Bluetooth", key: "s.lora.rnode.ble", default: 1 }
      # Everything below is Bluetooth's, so it is here only while Bluetooth is.
      # The gate is the ephemeral one rnode_ble.cpp publishes from the switch,
      # not the switch's own key: a settings surface reads a published gate.
      - section: "Bluetooth Settings"
        when_key: ble.rnode.enabled
      - dropdown:
          label: "Bluetooth tx power"
          key: "s.ble.rnode.txpower"
          default: 9
          options:
            - { v: 0,  l: "0 dBm" }
            - { v: 3,  l: "+3 dBm" }
            - { v: 6,  l: "+6 dBm" }
            - { v: 9,  l: "+9 dBm" }
            - { v: 12, l: "+12 dBm" }
            - { v: 15, l: "+15 dBm" }
            - { v: 18, l: "+18 dBm" }
            - { v: 20, l: "+20 dBm" }
        when_key: ble.rnode.enabled
      - info:
          rows:
            - value: { label: "Bluetooth", key: "ble.rnode.state_text" }
            - value: { label: "BT name", key: "ble.rnode.name" }
              when_key: ble.rnode.name
            - value: { label: "BT traffic", key: "ble.rnode.traffic" }
              when_key: ble.rnode.up
        when_key: ble.rnode.enabled
      # Pairing lives with the thing a phone actually pairs WITH. spangap-ble
      # owns the mechanism and the sentinels; any other consumer that needs a
      # phone to bond states this block too, under its own heading.
      - caption: "A phone can only pair with this device while the pairing window is open. Devices that have already paired reconnect at any time."
        when_key: ble.rnode.enabled
      # The sentinel is the ephemeral key `ble.pair` carrying the number of
      # seconds — never `s.ble.pairing`: a dot-path write under a scalar would
      # replace the scalar, and a sentinel is not configuration.
      - buttons:
          items:
            - { label: "Pair for 60 s", do: { set: { key: "ble.pair", value: "60", edge: true } } }
            - { label: "Close now",     do: { set: { key: "ble.pair", value: "0",  edge: true } } }
        when_key: ble.rnode.enabled
      - value: { label: "Pairing window", key: "ble.pairing_text" }
        when_key: ble.rnode.enabled
      # The bonds themselves, as a list: a count says a phone is paired, it does
      # not say which, and it gives nobody a way to drop one. spangap-ble
      # publishes the array and owns the ble.bond.* sentinel.
      - list:
          label: "Paired devices"
          caption: "Remove one and it has to pair again."
          key: ble.bondlist
          id: id
          item: "{addr}"
          empty: "Nothing has paired with this device yet."
          cmd: ble.bond
          remove: { confirm: "Forget {addr}?" }
        when_key: ble.rnode.enabled
      - button:
          label: "Forget all"
          color: red
          do:
            dialog:
              text: "Forget every paired device? Each one has to pair again."
              buttons:
                - { label: "Cancel" }
                - { label: "Forget all", color: red, do: { set: { key: "ble.forget", value: "all", edge: true } } }
        when_key: ble.rnode.enabled
